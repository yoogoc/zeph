name: Signed macOS release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag (must match Cargo.toml, e.g. v0.0.1)'
        required: true
permissions:
  contents: read
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: aarch64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --all-targets
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --locked --release --bin zeph
      - name: Package application
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: python3 scripts/release.py package --version "${RELEASE_TAG#v}" --arch '${{ matrix.arch }}' --output dist
      - uses: actions/upload-artifact@v4
        with:
          name: zeph-macos-${{ matrix.arch }}
          path: dist/*.app.tar.gz
          if-no-files-found: error
  publish:
    needs: build
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          pattern: zeph-macos-*
          path: artifacts
          merge-multiple: true
      - run: brew install minisign
      - name: Sign packages and manifest
        env:
          UPDATE_KEY: ${{ secrets.ZEPH_UPDATE_PRIVATE_KEY }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          test -n "$UPDATE_KEY"
          umask 077
          keyfile="${RUNNER_TEMP}/zeph-minisign.key"
          trap 'rm -f "$keyfile"' EXIT
          printf '%s\n' "$UPDATE_KEY" > "$keyfile"
          python3 scripts/release.py sign --directory artifacts --version "${RELEASE_TAG#v}" --key "$keyfile"
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@v2
      - name: Verify with the client verifier
        run: ZEPH_UPDATE_PUBLIC_KEY="$(cat assets/packaging/update-public-key)" cargo run --locked --no-default-features --bin verify-update -- artifacts
      - name: Publish draft, upload, then make release visible
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          # Never modify an already published release; clients may have cached it.
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > "$RUNNER_TEMP/zeph-draft" 2>/dev/null; then
            test "$(cat "$RUNNER_TEMP/zeph-draft")" = true
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Zeph ${RELEASE_TAG#v}" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" artifacts/* --clobber
          if [[ "$RELEASE_TAG" == *-dev.* ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease
          else
            gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest
          fi
