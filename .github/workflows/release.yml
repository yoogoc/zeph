name: Signed multi-platform release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag (must match Cargo.toml, e.g. v0.0.3)'
        required: true
permissions:
  contents: read
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: macos-aarch64
            executable: zeph
          - runner: macos-15-intel
            platform: macos-x86_64
            executable: zeph
          - runner: ubuntu-24.04
            platform: linux-x86_64
            executable: zeph
          - runner: ubuntu-24.04-arm
            platform: linux-aarch64
            executable: zeph
          - runner: windows-2022
            platform: windows-x86_64
            executable: zeph.exe
          - runner: windows-11-arm
            platform: windows-aarch64
            executable: zeph.exe
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      APPIMAGE_EXTRACT_AND_RUN: 1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@v2
        with:
          key: distribution-${{ matrix.platform }}
      - uses: ./.github/actions/linux-deps
        if: runner.os == 'Linux'
      - name: Install native packager
        if: runner.os != 'macOS'
        run: cargo install cargo-packager --version 0.11.8 --locked
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --all-targets
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --locked --release --bin zeph
      - name: Package application
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: python scripts/release.py native --version "${RELEASE_TAG#v}" --platform '${{ matrix.platform }}' --binary 'target/release/${{ matrix.executable }}' --output dist
      - uses: actions/upload-artifact@v4
        with:
          name: zeph-package-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
  publish:
    needs: build
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          pattern: zeph-package-*
          path: artifacts
          merge-multiple: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: brew install minisign
      - name: Sign packages and manifest
        env:
          UPDATE_KEY: ${{ secrets.ZEPH_UPDATE_PRIVATE_KEY }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          test -n "$UPDATE_KEY"
          umask 077
          keyfile="${RUNNER_TEMP}/zeph-minisign.key"
          trap 'rm -f "$keyfile"' EXIT
          printf '%s\n' "$UPDATE_KEY" > "$keyfile"
          python3 scripts/release.py sign --directory artifacts --version "${RELEASE_TAG#v}" --key "$keyfile"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verify with the client verifier
        run: ZEPH_UPDATE_PUBLIC_KEY="$(cat assets/packaging/update-public-key)" cargo run --locked --no-default-features --bin verify-update -- artifacts
      - name: Publish draft, upload, then make release visible
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          # Never modify an already published release; clients may have cached it.
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > "$RUNNER_TEMP/zeph-draft" 2>/dev/null; then
            test "$(cat "$RUNNER_TEMP/zeph-draft")" = true
          else
            python3 scripts/release.py notes --version "${RELEASE_TAG#v}" --output "$RUNNER_TEMP/zeph-release-notes.md"
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Zeph ${RELEASE_TAG#v}" --notes-file "$RUNNER_TEMP/zeph-release-notes.md"
          fi
          gh release upload "$RELEASE_TAG" artifacts/* --clobber
          if [[ "$RELEASE_TAG" == *-dev.* ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease
          else
            gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest
          fi
