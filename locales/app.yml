        en: "Duplicate parameter '%{name}'"
        zh-CN: "重复的参数 '%{name}'"
    value:
      not_empty:
        en: "Parameter value cannot be empty"
        zh-CN: "值不能为空"
      too_long:
        en: "Parameter value too long (max 2048 characters)"
        zh-CN: "值过长 (最大 2048 个字符)"
      syntax_error:
        en: "Parameter value cannot contain newline characters"
        zh-CN: "值不能包含换行符"

