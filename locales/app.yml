header:
  description:
    en: "Headers defined here will be automatically included in all HTTP requests within this folder."
    zh-CN: "在此处定义的请求头将自动包含所有此文件夹内的 HTTP 请求中。"
  add:
    en: "Add Header"
    zh-CN: "添加请求头"
  name:
    en: "Name"
    zh-CN: "名称"
  value:
    en: "Value"
    zh-CN: "值"
  empty:
    en: "No headers added"
    zh-CN: "无"
  validate:
    name:
      not_empty:
        en: "Header name cannot be empty"
        zh-CN: "名称不能为空"
      too_long:
        en: "Header name too long (max 100 characters)"
        zh-CN: "名称过长 (最大 100 个字符)"
      syntax_error:
        en: "Invalid header name format (use only letters, numbers, hyphens, and underscores)"
        zh-CN: "名称格式错误 (只能使用字母、数字、连字符和下划线)"
      reserved:
        en: "'%{name}' is a reserved header and cannot be set manually"
        zh-CN: "'%{name}' 是一个保留的请求头，无法手动设置"
      duplicate:
        en: "Duplicate header '%{name}'"
        zh-CN: "重复的请求头 '%{name}'"
    value:
      not_empty:
        en: "Header value cannot be empty"
        zh-CN: "值不能为空"
      too_long:
        en: "Header value too long (max 8192 characters)"
        zh-CN: "值过长 (最大 8192 个字符)"
      syntax_error:
        en: "Invalid header value format (contains invalid characters)"
        zh-CN: "值格式错误 (包含无效字符)"
parameter:
  description:
    en: "Parameters defined here will be automatically included as query parameters in all HTTP requests within this folder."
    zh-CN: "在此处定义的参数将自动作为查询参数包含所有此文件夹内的 HTTP 请求中。"
  add:
    en: "Add Parameter"
    zh-CN: "添加参数"
  name:
    en: "Parameter Name"
    zh-CN: "名称"
  value:
    en: "Parameter Value"
    zh-CN: "值"
  enabled:
    en: "Enabled"
    zh-CN: "启用"
  disabled:
    en: "Disabled"
    zh-CN: "禁用"
  toggle_tooltip:
    en: "Enable or disable this parameter"
    zh-CN: "启用或禁用此参数"
  remove_tooltip:
    en: "Remove this parameter"
    zh-CN: "删除此参数"
  encoding:
    warning:
      en: "Special characters will be URL-encoded automatically"
      zh-CN: "特殊字符将自动进行 URL 编码"
    error:
      en: "Failed to encode parameter value"
      zh-CN: "参数值编码失败"
  validate:
    name:
      not_empty:
        en: "Parameter name cannot be empty"
        zh-CN: "名称不能为空"
      too_long:
        en: "Parameter name too long (max 100 characters)"
        zh-CN: "名称过长 (最大 100 个字符)"
      syntax_error:
        en: "Invalid parameter name format (use only letters, numbers, hyphens, underscores, and dots)"
        zh-CN: "名称格式错误 (只能使用字母、数字、连字符、下划线、点)"
      reserved:
        en: "'%{name}' is a reserved parameter name"
        zh-CN: "'%{name}' 是一个保留的参数名称"
