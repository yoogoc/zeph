path_params:
  title:
    en: "Path Parameters"
    zh-CN: "路径参数"
  description:
    en: "Path parameters are placeholders in the URL path (e.g., /users/{userId}/posts/{postId})"
    zh-CN: "路径参数是 URL 路径中的占位符（例如：/users/{userId}/posts/{postId}）"
  empty:
    en: "No path parameters detected in URL"
    zh-CN: "URL 中未检测到路径参数"
  required:
    en: "Required"
    zh-CN: "必填"
  placeholder:
    en: "Enter value for {%{name}}"
    zh-CN: "输入 {%{name}} 的值"
  validate:
    missing_required:
      en: "Path parameter '{%{name}}' is required but has no value"
      zh-CN: "路径参数 '{%{name}}' 是必填的但没有值"
    value:
      not_empty:
        en: "Path parameter value cannot be empty"
        zh-CN: "路径参数值不能为空"
      too_long:
        en: "Path parameter value too long (max 256 characters)"
        zh-CN: "路径参数值过长（最大 256 个字符）"
  error:
    unresolved:
      en: "Some path parameters are not resolved. Please provide values for all required parameters."
      zh-CN: "某些路径参数未解析。请为所有必填参数提供值。"
    malformed_placeholder:
      en: "Malformed path parameter placeholder detected: %{placeholder}"
      zh-CN: "检测到格式错误的路径参数占位符：%{placeholder}"

