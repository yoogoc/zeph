[package]
name = "zeph"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
gpui = "0.2.2"
gpui-component = "0.5.0"
gpui-component-assets = "0.5.0"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "blocking", "cookies", "gzip", "brotli", "zstd", "deflate", "json", "multipart", "stream", "socks"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"