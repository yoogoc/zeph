[package]
name = "zeph"
default-run = "zeph"
version = "0.0.4"
edition = "2024"
description = "A local, native API workbench for HTTP, gRPC and WebSocket"

[features]
default = ["desktop"]
desktop = ["dep:gpui-kit", "dep:rfd", "credentials"]
credentials = ["dep:keyring"]

[[bin]]
name = "zeph"
path = "src/main.rs"
required-features = ["desktop"]

[dependencies]
gpui-kit = { version = "=0.7.1", optional = true, features = ["tree-sitter"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml_ng = "0.10"
url = { version = "2", features = ["serde"] }
percent-encoding = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "http2", "multipart", "stream", "json", "gzip", "brotli", "deflate", "system-proxy"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }
tonic = { version = "0.14", features = ["tls-native-roots"] }
tonic-reflection = "0.14"
prost = "0.14"
prost-reflect = { version = "0.16", features = ["serde"] }
protox = "0.10"
base64 = "0.22"
dirs = "6"
rfd = { version = "0.15", optional = true }
env_logger = "0.11"
log = "0.4"
sha2 = "0.10"
zeroize = "1"
keyring = { version = "3.6", optional = true, features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
semver = { version = "1", features = ["serde"] }
minisign-verify = "0.2.5"
fs2 = "0.4"
flate2 = "1"
tar = "0.4"
tempfile = "3"

[build-dependencies]
embed-resource = "3.0.12"
protox = "0.10"
tonic-prost-build = "0.14"

[dev-dependencies]
tempfile = "3"
tonic-prost = "0.14"
tokio-stream = { version = "0.1", features = ["net"] }

[profile.dev]
debug = "limited"
split-debuginfo = "unpacked"

[profile.dev.package.gpui-pre]
opt-level = 2

[package.metadata.packager]
product-name = "Zeph"
identifier = "dev.zeph.workbench"
description = "A local API workbench for HTTP, gRPC and WebSocket"
homepage = "https://github.com/yoogoc/zeph"
authors = ["yoogoc"]
category = "DeveloperTool"
binaries = [{ path = "zeph", main = true }]
icons = ["assets/app-icon/zeph.ico", "assets/app-icon/icon-32.png", "assets/app-icon/icon-128.png", "assets/app-icon/icon-256.png", "assets/app-icon/icon-512.png"]

[package.metadata.packager.deb]
depends = ["libasound2t64 | libasound2", "libfontconfig1", "libfreetype6", "libvulkan1", "libwayland-client0", "libx11-6", "libx11-xcb1", "libxcb1", "libxcb-render0", "libxcb-shape0", "libxcb-xfixes0", "libxkbcommon0", "libxkbcommon-x11-0", "libdbus-1-3", "libssl3t64 | libssl3"]
