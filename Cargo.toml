[workspace]
resolver = "2"
members = ["crates/*"]
default-members = ["crates/zeph"]

[workspace.package]
version = "0.0.1"
edition = "2021"
publish = false

#[workspace.metadata.i18n]
#available-locales = ["en"]
#default-locale = "en"
#load-path = "locales"

[workspace.dependencies]
i18n = { path = "crates/i18n" }

# GPUI
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_tokio = { git = "https://github.com/zed-industries/zed" }
reqwest_client = { git = "https://github.com/zed-industries/zed" }
gpui-component = { git = "https://github.com/longbridge/gpui-component", features = ["inspector"] }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component" }

# Others
anyhow = "1.0.44"
chrono = "0.4.38"
futures = "0.3"
itertools = "0.14.0"
log = "0.4"
oneshot = "0.1.10"
reqwest = { version = "0.12", features = ["json", "blocking", "cookies", "gzip", "brotli", "zstd", "deflate", "json", "multipart", "stream", "socks"] }
flume = { version = "0.12.0", default-features = false, features = ["async", "select"] }
rust-embed = "8.9.0"
rust-i18n = "3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
smallvec = "1.14.0"
smol = "2"
tracing = "0.1.40"
webbrowser = "1.0.4"
tracing-subscriber = { version = "0.3.18", features = ["fmt"] }

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[profile.profiling]
inherits = "release"
debug = true
